<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Inner glowing circle -->
  <circle cx="256" cy="256" r="185" fill="#ffffff" opacity="0.15" />
  <circle cx="256" cy="256" r="160" fill="#ffffff" opacity="0.95" filter="url(#shadow)" />

  <!-- Baby Face Icon -->
  <g transform="translate(136, 136)">
    <!-- Baby Face Contour -->
    <circle cx="120" cy="120" r="105" fill="#fde68a" stroke="#f59e0b" stroke-width="6" />

    <!-- Cute Cheeks -->
    <ellipse cx="65" cy="140" rx="16" ry="10" fill="#fca5a5" opacity="0.75" />
    <ellipse cx="175" cy="140" rx="16" ry="10" fill="#fca5a5" opacity="0.75" />

    <!-- Happy Eyes -->
    <path d="M 70 105 Q 85 90 100 105" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
    <path d="M 140 105 Q 155 90 170 105" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />

    <!-- Sweet Smile -->
    <path d="M 95 145 Q 120 175 145 145" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />

    <!-- Cute Top Tuft of Hair -->
    <path d="M 120 15 Q 145 -10 135 15" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Heart Badge on bottom right -->
  <circle cx="390" cy="390" r="48" fill="#ef4444" filter="url(#shadow)" />
  <path d="M 390 408 C 390 408 368 395 368 382 C 368 372 376 366 384 372 C 390 376 390 376 390 376 C 390 376 390 376 396 372 C 404 366 412 372 412 382 C 412 395 390 408 390 408 Z" fill="#ffffff" />
</svg>
